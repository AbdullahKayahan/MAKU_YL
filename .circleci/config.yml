version: 2.1

jobs:
  # 1. Ortak Test ve Kalite Kontrol Job'ı (Tüm branch'lerde çalışır)
  build-and-test:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout

      # --- 1. INSTALL DEPENDENCIES ---
      - run:
          name: Notify Slack - Install Started
          command: |
            curl -s -X POST --data-urlencode 'payload={"text": "⏳ *Test ve Kalite Kontrol* adımı başladı..."}' ${SLACK_WEBHOOK_URL} || true
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile

      # --- 2. RUN ESLINT ---
      - run:
          name: Run ESLint
          command: yarn lint

      # --- 3. CHECK TRANSLATION METADATA ---
      - run:
          name: Check translation metadata
          command: yarn lint:translations
    

      # --- 4. RUN TESTS ---

      - run:
          name: Run tests
          command: CI=true yarn test --watchAll=false --passWithNoTests
    
      # --- BAŞARI / HATA BİLDİRİMLERİ ---
      - run:
          name: Notify Slack - Success
          command: |
            curl -s -X POST --data-urlencode 'payload={"text": "🟢 *SUCCESS:* Test ve kalite kontrol adımları başarıyla tamamlandı!"}' ${SLACK_WEBHOOK_URL} || true

      - run:
          name: Notify Slack - Failure
          when: on_fail
          command: |
            curl -s -X POST --data-urlencode 'payload={"text": "🔴 *FAIL:* Test aşamasında bir hata oluştu!"}' ${SLACK_WEBHOOK_URL} || true


  # 2. Sadece Main Branch için Sürüm Artırma, Build ve Deploy Job'ı
  deploy:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile

      # --- 1. VERSION BUMP & GIT TAG ---
      - run:
          name: Notify Slack - Deployment Started
          command: |
            curl -s -X POST --data-urlencode 'payload={"text": "⏳ *Deployment* adımı başladı..."}' ${SLACK_WEBHOOK_URL} || true
      #- run:
      #    name: Increment Version and Push Tag
      #    command: |
      #      git config user.email "ci@circleci.com"
      #      git config user.name "CircleCI Bot"
      #      npm version patch -m "chore(release): %s [skip ci]"
      #      git push origin main --tags
     
      # --- 2. BUILD & DEPLOY TO CLOUDFLARE PAGES ---
      - run:
          name: Build React app
          command: yarn build
      - run:
          name: Deploy to Cloudflare Pages
          command: npx wrangler@3 pages deploy build --project-name="maku-yl"
          environment:
            CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
            CLOUDFLARE_ACCOUNT_ID: "eb230a04db87ee01573d36e5e11aa18a"

      # --- GENEL BAŞARI BİLDİRİMİ ---
      - run:
          name: Notify Slack - Success
          command: |
            curl -s -X POST --data-urlencode 'payload={"text": "🟢 *SUCCESS:* Main branch deployment tamamlandı, versiyon güncellendi ve site canlıya alındı!"}' ${SLACK_WEBHOOK_URL} || true

      # --- GENEL HATA BİLDİRİMİ ---
      - run:
          name: Notify Slack - Failure
          when: on_fail
          command: |
            curl -s -X POST --data-urlencode 'payload={"text": "🔴 *FAIL:* Deployment aşamasında bir hata oluştu!"}' ${SLACK_WEBHOOK_URL} || true


workflows:
  version: 2
  deployment-workflow:
    jobs:
      # Her branch'te önce testler çalışır
      - build-and-test

      # Sadece main branch'te, testler BAŞARIYLA bittikten sonra deploy çalışır
      - deploy:
          requires:
            - build-and-test
          filters:
            branches:
              only: main