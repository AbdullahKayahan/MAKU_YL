version: 2.1

jobs:
  build-and-deploy:
    docker:
      - image: cimg/node:20.11.0
    steps:
      - checkout

      - run:
          name: Deploy to Cloudflare Pages
          command: npx wrangler pages deploy . --project-name="maku-yl"

workflows:
  version: 2
  deployment-workflow:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main