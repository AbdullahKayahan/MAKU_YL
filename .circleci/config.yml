version: 2.1

jobs:
  build-and-deploy:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout

      - run:
          name: Deploy to Cloudflare Pages
          # Wrangler v3 sürümünü zorlayarak güncel v4 başlık hatalarını bypass ediyoruz
          command: CLOUDFLARE_ACCOUNT_ID="eb230a04db87ee01573d36e5e11aa18a" npx wrangler@3 pages deploy . --project-name="maku-yl"
          environment:
            CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

workflows:
  version: 2
  deployment-workflow:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main