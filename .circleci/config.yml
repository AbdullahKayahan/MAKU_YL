version: 2.1

jobs:
  build-and-deploy:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout

      - run:
          name: Deploy to Cloudflare Pages
          # echo "y" pipelama yöntemi ile olası onay pencerelerini otomatik geçiyoruz
          command: |
            CI=true CLOUDFLARE_ACCOUNT_ID="eb230a04db87ee01573d36e5e11aa18a" echo "y" | npx wrangler@3 pages deploy . --project-name="maku-yl" --branch="main"
          environment:
            CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}

workflows:
  version: 2
  deployment-workflow:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main