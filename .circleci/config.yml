version: 2.1

jobs:
  build-and-deploy:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout

      - run:
          name: Deploy to Cloudflare Pages
          command: npx wrangler pages deploy . --project-name="maku-yl"
          environment:
            CLOUDFLARE_API_TOKEN: $CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID: eb230a04db87ee01573d36e5e11aa18a

workflows:
  version: 2
  deployment-workflow:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main