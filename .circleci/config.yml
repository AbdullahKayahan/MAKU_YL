version: 2.1

orbs:
  slack: circleci/slack@4.1.3

jobs:
  build-and-deploy:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout

      # --- 1. INSTALL DEPENDENCIES ---
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "⏳ *[1/5] Install dependencies* adımı başladı..."}}]}'
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "✅ *[1/5] Install dependencies* adımı başarıyla tamamlandı."}}]}'

      # --- 2. RUN ESLINT ---
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "⏳ *[2/5] Run ESLint* adımı başladı..."}}]}'
      - run:
          name: Run ESLint
          command: yarn lint
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "✅ *[2/5] Run ESLint* adımı başarıyla tamamlandı."}}]}'

      # --- 3. CHECK TRANSLATION METADATA ---
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "⏳ *[3/5] Check translation metadata* adımı başladı..."}}]}'
      - run:
          name: Check translation metadata
          command: yarn lint:translations
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "✅ *[3/5] Check translation metadata* adımı başarıyla tamamlandı."}}]}'

      # --- 4. RUN TESTS ---
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "⏳ *[4/5] Run tests* adımı başladı..."}}]}'
      - run:
          name: Run tests
          command: CI=true yarn test --watchAll=false --passWithNoTests
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "✅ *[4/5] Run tests* adımı başarıyla tamamlandı."}}]}'

      # --- 5. BUILD REACT APP ---
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "⏳ *[5/5] Build React app* adımı başladı..."}}]}'
      - run:
          name: Build React app
          command: yarn build
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "✅ *[5/5] Build React app* adımı başarıyla tamamlandı."}}]}'

      # --- 6. DEPLOY TO CLOUDFLARE PAGES ---
      - slack/notify:
          event: always
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": "🚀 *Cloudflare Deploy* adımı başladı..."}}]}'
      - run:
          name: Deploy to Cloudflare Pages
          command: npx wrangler@3 pages deploy build --project-name="maku-yl"
          environment:
            CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
            CLOUDFLARE_ACCOUNT_ID: "eb230a04db87ee01573d36e5e11aa18a"

      # --- GENEL SONUÇ BİLDİRİMLERİ ---
      - slack/notify:
          event: pass
          template: basic_success_1
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": ":white_check_mark: *SUCCESS:* Tüm pipeline adımları başarıyla tamamlandı ve site canlıya alındı!"}}]}'

      - slack/notify:
          event: fail
          template: basic_fail_1
          custom: '{"blocks": [{"type": "section", "text": {"type": "mrkdwn", "text": ":x: *FAIL:* Pipeline adımlarından birinde hata oluştu, işlem durduruldu."}}]}'

workflows:
  version: 2
  deployment-workflow:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main