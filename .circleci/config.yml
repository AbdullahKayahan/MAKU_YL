version: 2.1

jobs:
 build-and-deploy:
    docker:
      - image: cimg/node:20.11.0 # Node.js ve npm'in yüklü olduğu resmi imaj
    steps:
      - checkout
    # 1. Node ve npm versiyonunu doğrulayın (Sorun giderme için faydalıdır)
      - run:
          name: Check Node version
          command: node -v && npm -v

      # 2. Bağımlılıkları yükleyin
      - run:
          name: Install Dependencies
          command: npm install

      - run:
          name: Statik Site Kontrolü
          command: |
            echo "Statik HTML sitesi başarıyla kontrol edildi."
            if [ -f "index.html" ]; then
              echo "index.html mevcut."
            else
              echo "Uyarı: index.html bulunamadı!"
              exit 1
            fi

      # 3. Cloudflare Wrangler CLI'ını kurup projenizi Pages'e gönderin
      - run:
          name: Deploy to Cloudflare Pages
          command: |
            npx wrangler pages deploy . --project-name="maku-yl"
           

workflows:
  version: 2
  main-workflow:
    jobs:
      - build-and-deploy:
          filters:
            branches:
              only: main # Sadece main branch'ine pushlandığında çalışır

     